*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--black);color:var(--white);font-family:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(24px,5vw,64px) clamp(16px,5vw,64px) 72px;gap:clamp(22px,4vw,44px);text-align:center;position:relative}

/* Opening statement, centred on its own */
.story{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;pointer-events:none;
  font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;line-height:1.05;letter-spacing:.03em;
  font-size:clamp(1.9rem,5.4vw,3.8rem);padding:0 5vw}
.story .l{display:block;clip-path:inset(0 100% 0 0)}
.story .t{display:inline-block;transform-origin:50% 100%}
.story .l2{color:var(--red);clip-path:none;opacity:0}
html:not(.intro) .story{display:none}

/* Logo, split into wordmark and tagline layers cut from the one original asset */
.logo{position:relative;width:min(92vw,880px);aspect-ratio:1161/364}
.logo .layer{position:absolute;inset:0;background:var(--logo) center/100% 100% no-repeat}
.logo .tagline{clip-path:inset(60% 0 0 0)}
.logo .mark{clip-path:inset(0 0 40% 0)}

.tag{display:inline-block;background:var(--red);color:var(--white);transform:skewX(-14deg);padding:.28em 1.5em .22em}
.tag span{display:block;transform:skewX(14deg);font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;
  font-size:clamp(1.5rem,4.2vw,2.5rem);letter-spacing:.22em;margin-right:-.22em;line-height:1.1}

footer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:.72rem;letter-spacing:.14em;color:#555}

/* Hidden until their moment */
.intro .logo .tagline,.intro .logo .mark,.intro .tag,.intro footer{opacity:0}

/* Sequence */
.story .l.in{animation:wipe-in .6s cubic-bezier(.7,0,.2,1) forwards}
.story.out .l{animation:wipe-out .45s cubic-bezier(.7,0,.2,1) forwards}
.story .l2.in{opacity:1;animation:fall .85s both}
.story.slam{animation:shake .45s .51s}
.story.slam .l1 .t{animation:hit .6s .51s both}
.story.out .l2{clip-path:inset(0 0 0 0)}
@keyframes fall{
  0%{transform:translateY(-115vh);animation-timing-function:cubic-bezier(.6,0,1,.7)}
  60%{transform:translateY(0);animation-timing-function:ease-out}
  70%{transform:scale(1.05,.8)}
  84%{transform:scale(.99,1.04)}
  100%{transform:none}
}
@keyframes hit{
  0%{transform:none}
  14%{transform:translateY(10px) scale(1.07,.62)}
  38%{transform:translateY(-5px) scale(.98,1.1) rotate(-.8deg)}
  62%{transform:rotate(.4deg)}
  100%{transform:none}
}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-8px,6px)}
  35%{transform:translate(7px,-4px)}
  55%{transform:translate(-4px,3px)}
  75%{transform:translate(2px,-1px)}
}
@keyframes wipe-in{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(-30% -15% -30% -15%)}}
@keyframes wipe-out{from{clip-path:inset(-30% -15% -30% -15%)}to{clip-path:inset(0 0 0 100%)}}

.logo .tagline.in{opacity:1;animation:tagline-in .8s cubic-bezier(.7,0,.2,1) both}
@keyframes tagline-in{from{clip-path:inset(60% 100% 0 0)}to{clip-path:inset(60% 0 0 0)}}

.logo .mark.in{opacity:1;animation:slam .55s cubic-bezier(.16,1,.3,1) both}
@keyframes slam{
  0%{clip-path:inset(0 100% 40% 0);transform:scale(1.14) translateY(-6px)}
  60%{clip-path:inset(0 0 40% 0);transform:scale(1.14) translateY(-6px)}
  100%{clip-path:inset(0 0 40% 0);transform:none}
}
/* wipe finishes fast, then the wordmark drops onto the tagline */
.logo .mark.in{animation:slam-wipe .22s linear both,slam-drop .5s .18s cubic-bezier(.16,1,.3,1) both}
@keyframes slam-wipe{from{clip-path:inset(0 100% 40% 0)}to{clip-path:inset(0 0 40% 0)}}
@keyframes slam-drop{from{transform:scale(1.14) translateY(-8px)}to{transform:none}}

.tag.in{opacity:1;animation:tag-in .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes tag-in{from{opacity:0;transform:skewX(-14deg) translateX(-28px)}to{opacity:1;transform:skewX(-14deg)}}
footer.in{opacity:1;transition:opacity 1s}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="story" aria-hidden="true">
    <span class="l l1"><span class="t">The standard got built</span></span>
    <span class="l l2">and then Someone decided to</span>
  </div>
  <div class="logo" role="img" aria-label="UNRIG. Break the standard.">
    <div class="layer tagline"></div>
    <div class="layer mark"></div>
  </div>
  <div class="tag"><span>Coming soon</span></div>
</main>
<footer>&copy; 2026 UNRIG</footer>
<script>
(function(){
  var root=document.documentElement;
  if(!root.classList.contains('intro')) return;
  var $=function(s){return document.querySelector(s)};
  var story=$('.story'),l1=$('.l1'),l2=$('.l2'),tl=$('.logo .tagline'),mk=$('.logo .mark'),tag=$('.tag'),ft=$('footer');

  /* Thanos-style disintegration: the two lines turn to dust and blow away */
  function dust(){
    var dpr=Math.min(window.devicePixelRatio||1,2),W=window.innerWidth,H=window.innerHeight;
    var cv=document.createElement('canvas');
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5';
    cv.setAttribute('aria-hidden','true');
    var c=cv.getContext('2d',{willReadFrequently:true});
    var step=Math.max(2,Math.round(2*dpr));
    var P={x:[],y:[],vx:[],vy:[],d:[],l:[],a:[],g:[]};
    var els=[l1.querySelector('.t'),$('.l2')];
    var gx0=1e9,gx1=0;
    els.forEach(function(el,gi){
      c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.scale(dpr,dpr);
      var cs=getComputedStyle(el);
      c.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
      c.fillStyle=cs.color;c.textBaseline='alphabetic';
      if('letterSpacing' in c) c.letterSpacing=cs.letterSpacing==='normal'?'0px':cs.letterSpacing;
      var tn=el.firstChild,txt=tn.nodeValue,re=/\S+/g,m;
      var bx0=1e9,by0=1e9,bx1=0,by1=0;
      while((m=re.exec(txt))){
        var r=document.createRange();r.setStart(tn,m.index);r.setEnd(tn,m.index+m[0].length);
        var b=r.getBoundingClientRect(),w=m[0].toUpperCase(),mt=c.measureText(w);
        var asc=mt.fontBoundingBoxAscent||parseFloat(cs.fontSize)*.82;
        c.fillText(w,b.left,b.top+asc);
        bx0=Math.min(bx0,b.left);by0=Math.min(by0,b.top);bx1=Math.max(bx1,b.right);by1=Math.max(by1,b.bottom);
      }
      bx0=Math.max(0,Math.floor(bx0-8));by0=Math.max(0,Math.floor(by0-8));
      bx1=Math.min(W,Math.ceil(bx1+8));by1=Math.min(H,Math.ceil(by1+8));
      var sx=Math.round(bx0*dpr),sy=Math.round(by0*dpr),sw=Math.round((bx1-bx0)*dpr),sh=Math.round((by1-by0)*dpr);
      var img=c.getImageData(sx,sy,sw,sh).data;
      for(var y=0;y<sh;y+=step){for(var x=0;x<sw;x+=step){
        var al=img[(y*sw+x)*4+3];
        if(al>60){P.x.push((sx+x)/dpr);P.y.push((sy+y)/dpr);P.a.push(al/255);P.g.push(gi);}
      }}
      gx0=Math.min(gx0,bx0);gx1=Math.max(gx1,bx1);
    });
    var n=P.x.length,size=step/dpr+.4,span=Math.max(1,gx1-gx0);
    for(var i=0;i<n;i++){
      var rx=(P.x[i]-gx0)/span;
      P.d.push(rx*350+Math.random()*110);
      P.l.push(450+Math.random()*300);
      P.vx.push(70+Math.random()*190);
      P.vy.push(-(20+Math.random()*150)+(Math.random()-.5)*50);
    }
    document.body.appendChild(cv);
    story.style.visibility='hidden';
    var colors=['#ffffff','#E32636'],t0=performance.now();
    c.setTransform(dpr,0,0,dpr,0,0);
    (function frame(now){
      var t=(now||t0)-t0,alive=0;
      c.clearRect(0,0,W,H);
      for(var g=0;g<2;g++){
        c.fillStyle=colors[g];
        for(var i=0;i<n;i++){
          if(P.g[i]!==g) continue;
          var lt=t-P.d[i];
          if(lt<=0){alive++;c.globalAlpha=P.a[i];c.fillRect(P.x[i],P.y[i],size,size);continue;}
          var p=lt/P.l[i];
          if(p>=1) continue;
          alive++;
          var s=lt/1000;
          var x=P.x[i]+P.vx[i]*s*(.5+p)+Math.sin(lt*.012+i)*4*p;
          var y=P.y[i]+P.vy[i]*s*(.5+p);
          c.globalAlpha=P.a[i]*(1-p)*(1-p);
          c.fillRect(x,y,size,size);
        }
      }
      c.globalAlpha=1;
      if(alive>0) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }
var t=[
  // 0.7s: "THE STANDARD GOT BUILT" wipes in, alone on the black screen
  [700, function(){l1.classList.add('in')}],
  // 1.8s: "AND THEN SOMEONE DECIDED TO" falls from the top of the screen.
  // The 'slam' class adds the screen shake and crushes the first line on impact.
  [1800,function(){l2.classList.add('in');story.classList.add('slam')}],
  // 4.2s: both lines turn to dust and blow away.
  // If the dust effect fails, it falls back to the plain wipe-out.
  [4200,function(){try{dust()}catch(e){story.classList.add('out')}}],
  // 6.0s: "BREAK THE STANDARD" and its red bar wipe in
  [6000,function(){tl.classList.add('in')}],
  // 7.2s: the UNRIG wordmark cuts in and drops onto the tagline
  [7200,function(){mk.classList.add('in')}],
  // 8.2s: the red "COMING SOON" tag slides in
  [8200,function(){tag.classList.add('in')}],
  // 9.1s: the small © 2026 UNRIG line fades in
  [9100,function(){ft.classList.add('in')}]
];
  t.forEach(function(x){setTimeout(x[1],x[0])});
})();
</script>
</body>
</html>
